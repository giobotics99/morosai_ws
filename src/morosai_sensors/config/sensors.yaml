  serial_port: "/dev/serial/by-id/usb-Silicon_Labs_CP2102_USB_to_UART_Bridge_6ddeb21a642a9c48be07ae66e837a4df-if00-port0"
  serial_baudrate: 256000
  frame_id: lidar_front_link
  scan_mode: "Sensitivity"

lidar_rear:
  node_name: sllidar_rear
  namespace: lidar_rear
  serial_port: "/dev/serial/by-id/usb-Silicon_Labs_CP2102_USB_to_UART_Bridge_a4e887758722a544970fdf170f4b6bb6-if00-port0"
  serial_baudrate: 256000
  frame_id: lidar_rear_link
  scan_mode: "Sensitivity"
