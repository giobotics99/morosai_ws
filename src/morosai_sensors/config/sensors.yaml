  namespace: lidar_front
  serial_port: "/dev/serial/by-id/usb-Silicon_Labs_CP2102_USB_to_UART_Bridge_f333c9419ca7234b9f2cfdddac5a97a8-if00-port0"
  #serial_port: "/dev/serial/by-id/usb-Silicon_Labs_CP2102_USB_to_UART_Bridge_8518796e58ffb144875d33c7ca8065af-if00-port0"
  serial_baudrate: 256000
  frame_id: lidar_front_link
  scan_mode: "Sensitivity"

lidar_rear:
  node_name: sllidar_rear
  namespace: lidar_rear
  serial_port: "/dev/serial/by-id/usb-Silicon_Labs_CP2102_USB_to_UART_Bridge_fcab49ffcd27784eb3648dfeefe635af-if00-port0"
  serial_baudrate: 256000
  frame_id: lidar_rear_link
  scan_mode: "Sensitivity"
