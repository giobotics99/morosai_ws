tof_camera:
  node_name: tof_camera_node
  namespace: tof
  frame_id: tof_link
  serial_number: "303000c"
  vertical_flip: false  # Camera mounted upright: node applies 180° correction

optical_head:
  node_name: optical_head_node
  namespace: optical_head
  frame_id: optical_head_link
  serial_port: "/dev/ttyACM0"
  # serial_port: "/dev/pgv100"

lidar_front:
